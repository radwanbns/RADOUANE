mkdir -p "$RUNNER_TEMP/dnstt-gopath/bin"

build_dnstt() {
  ABI="$1"
  GOARCH="$2"
  GOARM_VALUE="$3"
  OUTPUT="app/src/main/jniLibs/$ABI/libdnstt.so"

  echo "Building dnstt for Android $ABI ($GOARCH)"

  if [ -n "$GOARM_VALUE" ]; then
    env -u GOBIN GOPATH="$RUNNER_TEMP/dnstt-gopath" GOOS=android GOARCH="$GOARCH" GOARM="$GOARM_VALUE" CGO_ENABLED=0 \
      go install -trimpath -ldflags="-s -w" "www.bamsoftware.com/git/dnstt.git/dnstt-client@$VERSION"
  else
    env -u GOBIN GOPATH="$RUNNER_TEMP/dnstt-gopath" GOOS=android GOARCH="$GOARCH" CGO_ENABLED=0 \
      go install -trimpath -ldflags="-s -w" "www.bamsoftware.com/git/dnstt.git/dnstt-client@$VERSION"
  fi

  cp "$RUNNER_TEMP/dnstt-gopath/bin/dnstt-client" "$OUTPUT"
  chmod 755 "$OUTPUT"
  test -s "$OUTPUT"
}
