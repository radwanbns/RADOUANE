name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  # ثبّت وسماً/commit مُجرَّباً بدل master لضمان بناء قابل للتكرار
  ICS_OPENVPN_REF: master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false

      - name: Download Xray core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

      # ---- OpenVPN حقيقي: بناء ics-openvpn كـ AAR (GPLv2، يحتاج NDK + submodules) ----
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.14904198" "cmake;3.22.1"

      # Build dnstt as pure-Go Android executables (no CGO/NDK cross-compiler needed).
      # The app launches this executable as a process; .so is the expected packaged filename.
      - name: Build SlowDNS core (dnstt) for Android
        env:
          DNSTT_VERSION: v1.20260501.0
        run: |
          set -euxo pipefail
          MODULE="www.bamsoftware.com/git/dnstt.git/dnstt-client"

          build_dnstt() {
            ABI="$1"
            GOARCH="$2"
            GOARM="$3"
            OUT="app/src/main/jniLibs/$ABI"
            GOPATH_DIR="$RUNNER_TEMP/gopath-$ABI"
            mkdir -p "$OUT" "$GOPATH_DIR"

            if [ -n "$GOARM" ]; then
              env -u GOBIN GOPATH="$GOPATH_DIR" GOOS=android GOARCH="$GOARCH" GOARM="$GOARM" CGO_ENABLED=0 \
                go install -trimpath -ldflags="-s -w" "$MODULE@$DNSTT_VERSION"
            else
              env -u GOBIN GOPATH="$GOPATH_DIR" GOOS=android GOARCH="$GOARCH" CGO_ENABLED=0 \
                go install -trimpath -ldflags="-s -w" "$MODULE@$DNSTT_VERSION"
            fi

            BINARY="$GOPATH_DIR/bin/dnstt-client"
            if [ ! -s "$BINARY" ]; then
              echo "::error::dnstt-client was not produced for $ABI"
              find "$GOPATH_DIR" -maxdepth 4 -type f -print || true
              return 1
            fi
            cp "$BINARY" "$OUT/libdnstt.so"
            chmod 755 "$OUT/libdnstt.so"
            file "$OUT/libdnstt.so"
            readelf -h "$OUT/libdnstt.so" | grep -E "Class:|Machine:"
          }

          build_dnstt arm64-v8a arm64 ""
          build_dnstt armeabi-v7a arm 7
          build_dnstt x86_64 amd64 ""
          build_dnstt x86 386 ""

          echo "Built SlowDNS cores:"
          find app/src/main/jniLibs -type f -name libdnstt.so -ls
          test "$(find app/src/main/jniLibs -type f -name libdnstt.so | wc -l)" -eq 4

      - name: Clone ics-openvpn
        run: |
          git clone --recurse-submodules --depth 1 --branch "$ICS_OPENVPN_REF" \
            https://github.com/schwabe/ics-openvpn.git /tmp/ics-openvpn

      # :main في ics تطبيق (application) لا ينتج AAR؛ نحوّله إلى library أثناء البناء فقط
      - name: Convert ics-openvpn main module to a library
        working-directory: /tmp/ics-openvpn
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ics_to_library.py"

      - name: Build ics-openvpn (AAR)
        working-directory: /tmp/ics-openvpn
        run: |
          ./gradlew --no-daemon :main:tasks --all > /tmp/ics-tasks.txt
          CANDIDATES=$(grep -oE '^assemble[A-Za-z0-9]*Ovpn23Release' /tmp/ics-tasks.txt | sort -u)
          echo "Candidate tasks:"; echo "$CANDIDATES"
          # نفضّل skeleton (بدون واجهة ics وأيقونتها)، وإلا أول نسخة متاحة
          TASK=$(echo "$CANDIDATES" | grep -i skeleton | head -n1)
          [ -n "$TASK" ] || TASK=$(echo "$CANDIDATES" | head -n1)
          test -n "$TASK" || { echo "No ovpn23 release assemble task found"; exit 1; }
          echo "Using task: $TASK"
          ./gradlew --no-daemon ":main:$TASK"
          echo "AARs:"; find main/build/outputs/aar -name '*.aar'

      - name: Package ics-openvpn.aar
        working-directory: /tmp/ics-openvpn
        run: |
          AAR=$(find main/build/outputs/aar -name '*.aar' | grep -i ovpn23 | grep -i release | head -n1)
          test -n "$AAR" || { echo "ics-openvpn AAR not found"; exit 1; }
          echo "Source AAR: $AAR"
          rm -rf /tmp/aar && mkdir /tmp/aar && cd /tmp/aar && unzip -q "/tmp/ics-openvpn/$AAR"
          # AGP 8.5.2 يرفض AAR يشترط compileSdk/AGP أحدث؛ نخفّض الشروط (الكلاسات تعمل على 26+ بحسب ics)
          META=META-INF/com/android/build/gradle/aar-metadata.properties
          echo "--- metadata before"; cat "$META" || true
          sed -i -E 's/^minCompileSdk=.*/minCompileSdk=34/; s/^minAgpVersion=.*/minAgpVersion=8.1.0/; /^minCompileSdkExtension=/d' "$META"
          echo "--- metadata after"; cat "$META"
          zip -qr "$GITHUB_WORKSPACE/app/libs/ics-openvpn.aar" .

      - name: Verify ics-openvpn AAR
        run: |
          ls -la app/libs
          unzip -p app/libs/ics-openvpn.aar classes.jar > /tmp/ics-classes.jar
          unzip -l /tmp/ics-classes.jar | grep -E "core/(VpnStatus|ConfigParser|ProfileManager|OpenVPNService|VPNLaunchHelper)\.class"

      - name: Build
        run: gradle assembleRelease --no-daemon
      - name: Verify SlowDNS core is packaged in APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          echo "Checking APK: $APK"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" | grep -F "lib/$ABI/libdnstt.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: XrayTunnel-apk
          path: app/build/outputs/apk/release/*.apk
